version: 2

project_name: tusk-ai-secured-gateway

# The React admin console is go:embed'd into the binary at compile time
# (internal/api/ui/ui.go, //go:embed dist/*), so internal/api/ui/dist must
# already be populated on disk before goreleaser's `go build` runs. That
# build happens in a dedicated "web" step in .github/workflows/release.yml
# (npm ci && npm run build --prefix web), not here.
before:
  hooks:
    - go mod download
    # Generates THIRD_PARTY_NOTICES (see tools/notices, Makefile's `notices`
    # target) and fails the release if any Go dependency's license isn't on
    # the allow list in tools/notices/main.go. archives.files below ships
    # the result in every release tarball.
    - make notices

builds:
  - id: gateway
    main: ./cmd/gateway
    binary: gateway
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: gateway
    ids: [gateway]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES

checksum:
  name_template: checksums.txt

# Attaches a CycloneDX SBOM (Software Bill of Materials) to each release
# archive, generated by the `syft` CLI -- goreleaser shells out to it, so it
# must be on PATH wherever this pipe runs (release.yml installs it via
# anchore/sbom-action/download-syft, pinned the same way as this repo's
# other third-party actions). The archives/sboms pipes only run for
# `goreleaser release` (with or without --snapshot), not for `goreleaser
# build` -- Makefile's `snapshot` target uses `build --single-target` and
# never touches this; a full `release --snapshot` locally needs syft on
# PATH too, or pass --skip=sbom.
sboms:
  - id: archive
    artifacts: archive

# GoReleaser's own changelog (commits since the previous tag) becomes the
# GitHub Release's generated notes; merge commits and chore/docs-only
# commits are dropped so the notes stay reader-facing.
changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: Tuskira
    name: tusk-ai-secured-gateway
  draft: false
  prerelease: auto

# dockers/docker_manifests build linux/amd64 + linux/arm64 images from the
# binaries built above (Dockerfile.goreleaser just copies the prebuilt
# binary into a distroless base -- it does not rebuild from source; see
# that file's header comment) and push them to GHCR under two tags:
# the release version and "latest".
dockers:
  - id: gateway-linux-amd64
    ids: [gateway]
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: Dockerfile.goreleaser
    # Copied into the Docker build context so Dockerfile.goreleaser can
    # place them at /licenses/ in the image -- THIRD_PARTY_NOTICES is
    # generated by the before.hooks `make notices` step above; this
    # Dockerfile doesn't build from source, so it can't generate it itself.
    extra_files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES
    image_templates:
      - "ghcr.io/tuskira/tusk-ai-secured-gateway:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/Tuskira/tusk-ai-secured-gateway"
      # tusk-ai-secured-gateway itself is Apache-2.0 (this label describes
      # the subject software, per the OCI annotations spec, not every file in
      # the image). The image also bundles third-party components under their
      # own permissive licenses (Go stdlib + modules, the React console's
      # dependencies, a handful of Debian packages from the distroless base);
      # their notices are at /licenses/ in the image (see Dockerfile.goreleaser
      # and docs/third-party-notices.md), which image.description points at so
      # this label is never read on its own as "100% Apache-2.0 bytes".
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
      - "--label=org.opencontainers.image.description=tusk-ai-secured-gateway is Apache-2.0; third-party license notices for everything else bundled in this image are at /licenses/"

  - id: gateway-linux-arm64
    ids: [gateway]
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: Dockerfile.goreleaser
    # Copied into the Docker build context so Dockerfile.goreleaser can
    # place them at /licenses/ in the image -- THIRD_PARTY_NOTICES is
    # generated by the before.hooks `make notices` step above; this
    # Dockerfile doesn't build from source, so it can't generate it itself.
    extra_files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES
    image_templates:
      - "ghcr.io/tuskira/tusk-ai-secured-gateway:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/Tuskira/tusk-ai-secured-gateway"
      # tusk-ai-secured-gateway itself is Apache-2.0 (this label describes
      # the subject software, per the OCI annotations spec, not every file in
      # the image). The image also bundles third-party components under their
      # own permissive licenses (Go stdlib + modules, the React console's
      # dependencies, a handful of Debian packages from the distroless base);
      # their notices are at /licenses/ in the image (see Dockerfile.goreleaser
      # and docs/third-party-notices.md), which image.description points at so
      # this label is never read on its own as "100% Apache-2.0 bytes".
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
      - "--label=org.opencontainers.image.description=tusk-ai-secured-gateway is Apache-2.0; third-party license notices for everything else bundled in this image are at /licenses/"

docker_manifests:
  - name_template: "ghcr.io/tuskira/tusk-ai-secured-gateway:{{ .Version }}"
    image_templates:
      - "ghcr.io/tuskira/tusk-ai-secured-gateway:{{ .Version }}-amd64"
      - "ghcr.io/tuskira/tusk-ai-secured-gateway:{{ .Version }}-arm64"
  - name_template: "ghcr.io/tuskira/tusk-ai-secured-gateway:latest"
    image_templates:
      - "ghcr.io/tuskira/tusk-ai-secured-gateway:{{ .Version }}-amd64"
      - "ghcr.io/tuskira/tusk-ai-secured-gateway:{{ .Version }}-arm64"
