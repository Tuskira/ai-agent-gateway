name: CLA Assistant

# Enforces the Tuskira Contributor License Agreement (see
# .github/cla/INDIVIDUAL_CLA.md and CONTRIBUTING.md's "Contributor License
# Agreement" section) using the contributor-assistant/github-action. A
# first-time contributor is asked to sign by commenting on their pull
# request; the action records signatures in a `signatures/version1/cla.json`
# file on the `cla-signatures` branch (kept separate from `main` so
# signature commits never need review) and sets a required status check.
#
# Security note: this runs on `pull_request_target`, which executes in the
# context of the base repository (not the fork) and has access to repo
# secrets/tokens even for PRs from forks. This workflow deliberately never
# checks out the PR's head commit or runs any code from it — the action
# only reads the PR's metadata and comments through the GitHub API — so a
# malicious PR cannot use this workflow to run its own code with this
# token. Do not add an `actions/checkout` of the PR head to this workflow.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    name: Check CLA signature
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          (github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        # contributor-assistant/github-action, pinned by commit SHA (the
        # commit the v2.6.1 tag points to — see
        # https://github.com/contributor-assistant/github-action/releases/tag/v2.6.1).
        # Bump deliberately: check the release notes before moving this pin.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          # Builds the raw document URL from whatever repo this workflow
          # runs in, so it keeps working if the repo is ever forked or
          # renamed, rather than hardcoding Tuskira/tusk-ai-secured-gateway.
          path-to-document: >-
            ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/.github/cla/INDIVIDUAL_CLA.md
          # Signatures live on their own branch, never on main, so a
          # signature commit from the bot is never something a human has
          # to review or rebase around.
          branch: 'cla-signatures'
          # Bots that open PRs (e.g. automated dependency bumps) don't
          # author copyrightable Contributions and are exempt. Add a
          # company's authorized employees here too (see
          # .github/cla/CORPORATE_CLA.md's Schedule A) if you'd rather
          # allowlist by GitHub username than rely on them each commenting
          # to sign individually — most corporate signers should still sign
          # individually so the bot's signature record stays accurate.
          allowlist: 'dependabot[bot],github-actions[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
