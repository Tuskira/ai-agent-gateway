apiVersion: v1
kind: Service
metadata:
  name: gateway-mcp
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: ai-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: mcp
  ports:
    - name: http-mcp
      port: 8080
      targetPort: http-mcp
