name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push images to ghcr.io
    concurrency:
      group: release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser's changelog needs full history

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # internal/api/ui/dist is go:embed'd into the gateway binary at
      # compile time (internal/api/ui/ui.go); it must exist on disk
      # before goreleaser's `go build` runs below.
      - name: web (build UI, embedded by the Go build below)
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser's sboms pipe (.goreleaser.yaml) shells out to the syft
      # CLI; this installs just the binary, same as .github/workflows/ci.yml
      # does for gitleaks, pinned by commit SHA like this repo's other
      # third-party actions.
      - uses: anchore/sbom-action/download-syft@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Packs the console as the library @tuskira/gateway-web and attaches the
  # tarball to the GitHub Release that the release job creates. The package
  # is not published to the npm registry. This job is not a dependency of
  # the release job, so a failure here cannot fail the Go release.
  console-tarball:
    name: attach console library tarball
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the asset to the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        working-directory: web
        run: npm ci

      # The tarball version always equals the release tag. npm version
      # exits non-zero when the version is already current, so skip it then.
      - name: set version from tag
        working-directory: web
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [ "$(node -p "require('./package.json').version")" != "$version" ]; then
            npm version --no-git-tag-version "$version"
          fi

      - name: build library
        working-directory: web
        run: npm run build:lib

      - name: pack
        working-directory: web
        run: npm pack

      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" web/tuskira-gateway-web-*.tgz --clobber
