apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-mcp
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: ai-gateway
spec:
  # KEEP AT 1 with the default session store. sessions.store: memory keeps
  # MCP sessions in-process, so a second replica would not see sessions
  # created on the first one -- requests bouncing between pods would hit
  # "session not found" and re-initialize. To scale this Deployment, put
  # sessions in Redis: ../overlays/redis sets GATEWAY_SESSIONS_STORE=redis
  # (+ GATEWAY_REDIS_ENABLED/ADDR) and raises replicas to 2. See
  # deploy/README.md, "Scaling per plane".
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: mcp
        app.kubernetes.io/part-of: ai-gateway
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gateway
                    app.kubernetes.io/component: mcp
      containers:
        - name: gateway
          image: ghcr.io/tuskira/tusk-ai-secured-gateway:latest # overridden by the images: pin in kustomization.yaml when applied via kustomize
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-mcp
              containerPort: 8080
          env:
            - name: CONFIG_PATH
              value: /etc/gateway/config.yaml
            - name: GATEWAY_MCP_ENABLED
              value: "true"
            - name: GATEWAY_API_ENABLED
              value: "false"
            - name: GATEWAY_LLM_PROXY_ENABLED
              value: "false"
          envFrom:
            - configMapRef:
                name: gateway-env
            - secretRef:
                name: gateway-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http-mcp
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http-mcp
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: gateway-config
