# Secret detection for the rule engine (LLM02 secret egress, and the
# redaction applied before anything is sent to the judge model or stored as evidence).
#
# gitleaks' default ruleset (~220 rules, the same one CI runs), plus the
# additions below. A rule id is the redaction marker's kind:
# [REDACTED:<rule id>].
title = "detection secret rules"

[extend]
useDefault = true

# user:password in a database or broker URL. The default ruleset has no
# rule for these.
[[rules]]
id = "connection-string-password"
description = "Password in a database or message broker connection string"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|rediss?|amqps?|mssql|sqlserver|clickhouse)://[^\s:/@]+:([^\s:/@]{4,})@[^\s/]+'''
secretGroup = 1
keywords = ["://"]
[[rules.allowlists]]
description = "Template placeholders, not credentials"
regexTarget = "secret"
regexes = ['''^(?:\$\{?[A-Za-z_][A-Za-z0-9_]*\}?|<[^>]*>|\*+|x+|X+|\.\.\.|password|passwd|changeme|secret|pass)$''']

# A private key block clipped before its END line (tool output is clipped
# for the judge model and for evidence). The default private-key rule needs the END
# line; the engine drops this rule's finding when the block is complete.
[[rules]]
id = "private-key-unterminated"
description = "Private key block without its END line"
regex = '''-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----[\s\S]{32,}'''
keywords = ["-----begin"]
