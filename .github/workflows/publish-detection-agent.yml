name: Publish detection agent

# Builds the detection agent image (Dockerfile.detection-agent; the agent is
# the nested module in detection/, see docs/detection-agent.md) and pushes it
# to GHCR as ghcr.io/tuskira/ai-agent-gateway-detection-agent:<version> for
# a tag detection/vX.Y.Z. The agent is versioned on its own: these tags are
# ignored by the gateway's releases (.goreleaser.yaml, git.ignore_tags).
#
# Runs on GitHub-hosted runners with the repository's own GITHUB_TOKEN
# (packages: write); no cloud credentials, no self-hosted runner.

on:
  push:
    tags:
      - "detection/v*"

permissions: {}

env:
  IMAGE: ghcr.io/tuskira/ai-agent-gateway-detection-agent

jobs:
  publish:
    name: build and push to GHCR
    if: github.repository == 'Tuskira/ai-agent-gateway'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: image metadata
        id: meta
        run: |
          # detection/v0.1.0 -> 0.1.0
          echo "version=${GITHUB_REF_NAME#detection/v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 + linux/arm64 like the gateway images.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.detection-agent
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          # The licenses label describes the subject software (Apache-2.0),
          # not every file in the image; third-party notices are baked into
          # the image at /licenses/ (see Dockerfile.detection-agent).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Detection agent sidecar for the AI gateway; third-party license notices for everything bundled in this image are at /licenses/
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: echo "Published ${IMAGE}:${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
