apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ai-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api
  ports:
    - name: http-api
      port: 8081
      targetPort: http-api
