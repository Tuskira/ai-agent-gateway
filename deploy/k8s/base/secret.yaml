# Template only -- both values below are placeholders. Replace them (or
# regenerate this Secret with `kubectl create secret generic --dry-run`
# piped to `kubectl apply -f -`, or a sealed-secrets/external-secrets
# controller) before applying to any real cluster. Do not commit real
# values over these placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: ai-gateway
  labels:
    app.kubernetes.io/part-of: ai-gateway
type: Opaque
stringData:
  # Encrypts/decrypts every row in the credential store (internal/secrets);
  # losing it makes every stored connector credential unrecoverable.
  # Generate one with:
  #   gateway secrets genkey
  # (run from a checkout: `go run ./cmd/gateway secrets genkey`, or against
  # the image: `docker run --rm ghcr.io/tuskira/ai-agent-gateway:latest secrets genkey`)
  # For rotation, see `gateway secrets rekey` and secret_store's doc comment
  # in configs/base/default.yml (comma-separated "id:key" ring).
  GATEWAY_MASTER_KEY: "REPLACE_ME"
  # Must match the password of the GATEWAY_DATABASE_USER configured in the
  # gateway-env ConfigMap.
  GATEWAY_DATABASE_PASSWORD: "REPLACE_ME"
