name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push images to ghcr.io
    concurrency:
      group: release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser's changelog needs full history

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # internal/api/ui/dist is go:embed'd into the gateway binary at
      # compile time (internal/api/ui/ui.go); it must exist on disk
      # before goreleaser's `go build` runs below.
      - name: web (build UI, embedded by the Go build below)
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser's sboms pipe (.goreleaser.yaml) shells out to the syft
      # CLI; this installs just the binary, same as .github/workflows/ci.yml
      # does for gitleaks, pinned by commit SHA like this repo's other
      # third-party actions.
      - uses: anchore/sbom-action/download-syft@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the console as the npm library @tuskira/gateway-web. Needs an
  # NPM_TOKEN repository secret; without it the build still runs and the
  # publish step is skipped so tagged releases do not fail.
  npm-publish:
    name: publish console to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build library
        working-directory: web
        run: |
          npm ci
          npm run build:lib

      - name: set version from tag
        working-directory: web
        env:
          TAG: ${{ github.ref_name }}
        run: npm version --no-git-tag-version "${TAG#v}"

      - name: publish
        if: env.NPM_TOKEN != ''
        working-directory: web
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish --access public --provenance
