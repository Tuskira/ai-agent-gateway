# Template values, same as ../../base/secret.yaml -- replace before
# applying for real. GATEWAY_SINKS_CLICKHOUSE_PASSWORD (read by the gateway
# containers via envFrom) and CLICKHOUSE_PASSWORD (read by the ClickHouse
# StatefulSet container directly) must hold the same value.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: ai-gateway
type: Opaque
stringData:
  GATEWAY_SINKS_CLICKHOUSE_PASSWORD: "REPLACE_ME"
  CLICKHOUSE_PASSWORD: "REPLACE_ME"
