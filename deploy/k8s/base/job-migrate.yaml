# Runs `gateway migrate` (cmd/gateway/main.go's runMigrate) to apply every
# pending Postgres migration and exit. Helm would wire this as a
# pre-install/pre-upgrade hook; kustomize has no hook concept, so run it
# explicitly, before the plane Deployments come up (or before a rollout of
# a version with new migrations) -- see deploy/README.md's "Upgrading".
#
# A fresh `kubectl apply -k` also creates the three Deployments in the same
# batch; that's fine even if they start before this Job finishes; migrate
# only alters the schema (each Deployment additionally has
# GATEWAY_DATABASE_MIGRATE=false, so none of them attempt their own
# auto-migrate and race this Job) -- but a plane pod added before its table
# exists yet can crash-loop briefly until the schema is present. If that
# matters to you, apply base/ excluding the Deployments first, run this Job,
# then apply the Deployments, or note that new Job objects are not
# `kubectl apply`-idempotent -- reruns need `kubectl delete job
# gateway-migrate` first (or `kubectl create job --from=job/gateway-migrate`
# for a one-off rerun).
#
# backoffLimit: verified against a real cluster (kind) -- on a brand-new
# `kubectl apply -k`, this Job's first 1-2 pods can fail before Postgres
# finishes starting and its DNS record propagates ("hostname resolving
# error: lookup postgres ..."); it self-heals via retry within a few
# seconds. 6 leaves real headroom beyond the ~2 retries observed.
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-migrate
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: ai-gateway
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: ai-gateway
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Keep this in sync with the plane Deployments' image/tag.
          image: ghcr.io/tuskira/tusk-ai-secured-gateway:latest
          imagePullPolicy: IfNotPresent
          args: ["migrate"] # entrypoint is ["/gateway"]; this runs `/gateway migrate`
          env:
            - name: CONFIG_PATH
              value: /etc/gateway/config.yaml
          envFrom:
            - configMapRef:
                name: gateway-env
            - secretRef:
                name: gateway-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: gateway-config
