apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ai-gateway
spec:
  # Matches the gateway-api HPA's minReplicas so the first apply doesn't
  # immediately get scaled down by the HPA reconciling against a mismatched
  # initial count.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: ai-gateway
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gateway
                    app.kubernetes.io/component: api
      containers:
        - name: gateway
          # One image runs any subset of the mcp/api/llm_proxy planes
          # (internal/config.MCP.Enabled / API.Enabled / LLMProxy.Enabled);
          # which subset is selected below via env. Pin this to a release
          # tag or digest before production use -- ":latest" is for the
          # quickstart only.
          image: ghcr.io/tuskira/ai-agent-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-api
              containerPort: 8081
          env:
            - name: CONFIG_PATH
              value: /etc/gateway/config.yaml
            - name: GATEWAY_API_ENABLED
              value: "true"
            - name: GATEWAY_MCP_ENABLED
              value: "false"
            - name: GATEWAY_LLM_PROXY_ENABLED
              value: "false"
          envFrom:
            - configMapRef:
                name: gateway-env
            - secretRef:
                name: gateway-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http-api
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: gateway-config
