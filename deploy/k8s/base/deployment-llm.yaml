apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-llm
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: llm
    app.kubernetes.io/part-of: ai-gateway
spec:
  # Matches the gateway-llm HPA's minReplicas; see deployment-api.yaml's
  # comment on the same pattern.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/component: llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: llm
        app.kubernetes.io/part-of: ai-gateway
    spec:
      # LLM responses can stream for a long time (llm_proxy.limits.
      # max_stream_duration, default 15m/900s -- see configs/base/default.yml
      # and internal/config.LLMLimits). On a rolling update or node drain,
      # SIGTERM starts the drain but in-flight streamed responses must be
      # allowed to finish rather than being cut off; this is set to the same
      # 900s so the grace period never expires before max_stream_duration
      # would have. Raise both together if you raise the limit.
      terminationGracePeriodSeconds: 900
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gateway
                    app.kubernetes.io/component: llm
      containers:
        - name: gateway
          image: ghcr.io/tuskira/tusk-ai-secured-gateway:latest # overridden by the images: pin in kustomization.yaml when applied via kustomize
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-llm
              containerPort: 8082
          env:
            - name: CONFIG_PATH
              value: /etc/gateway/config.yaml
            - name: GATEWAY_LLM_PROXY_ENABLED
              value: "true"
            - name: GATEWAY_API_ENABLED
              value: "false"
            - name: GATEWAY_MCP_ENABLED
              value: "false"
          envFrom:
            - configMapRef:
                name: gateway-env
            - secretRef:
                name: gateway-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http-llm
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http-llm
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: gateway-config
