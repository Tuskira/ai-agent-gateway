# Swap ClusterIP for NodePort so the planes are reachable without an
# ingress controller in kind. `kubectl apply -k` in this overlay does not
# install ingress-nginx, so base's two Ingress objects are deleted instead
# (delete-ingresses-patch.yaml) rather than left dangling with no
# controller to satisfy them. (kind also supports port-mapping extraPortBindings
# for NodePorts at cluster-create time if you want them reachable from the
# host without `kubectl port-forward`; deploy/README.md uses port-forward
# instead, which needs no extra kind config.)
apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: ai-gateway
spec:
  type: NodePort
  ports:
    - name: http-api
      port: 8081
      targetPort: http-api
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-mcp
  namespace: ai-gateway
spec:
  type: NodePort
  ports:
    - name: http-mcp
      port: 8080
      targetPort: http-mcp
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-llm
  namespace: ai-gateway
spec:
  type: NodePort
  ports:
    - name: http-llm
      port: 8082
      targetPort: http-llm
      nodePort: 30082
